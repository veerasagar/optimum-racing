[tool.poetry]
name = "optimum-racing"
version = "0.1.0"
description = "A Formula one race strategy predictor."
authors = ["veerasagar <veerasagar24502@gmail.com>, rcoel <reevancoelho@gmail.com>"]

[tool.poetry.dependencies]
python = "^3.8"
numpy = "^1.23"
pandas = "^1.5"
scikit-learn = "^1.2"
matplotlib = "^3.6"
seaborn = "^0.12"
tensorflow = "^2.10"
keras = "^2.10"
torch = "^1.13"
torchvision = "^0.14"
fastai = "^2.7"
xgboost = "^1.7"
fastf1 = "^1.8"

[tool.poetry.dev-dependencies]
pytest = "^7.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
